<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>firefly</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ml5@0.12.2/dist/ml5.min.js"></script>
</head>
<body>
    <div id="shared-jar" class="player-jar player-jar-shared" role="group" tabindex="0" aria-label="Shared firefly jar. Drag to move; use arrow keys to reposition.">
        <div id="shared-jar-count" class="jar-count" aria-label="Fireflies caught">0</div>
    </div>
    <div id="pose-controls">
        <button id="pose-start" type="button" aria-label="Enable PoseNet controls" title="Enable PoseNet controls">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8.5 11V5.75a1.5 1.5 0 0 1 3 0V10 4.75a1.5 1.5 0 0 1 3 0V10 6.25a1.5 1.5 0 0 1 3 0v5.5l.65-1.3a1.6 1.6 0 0 1 2.85 1.45l-2.6 5.2A5 5 0 0 1 13.93 20h-1.2a5 5 0 0 1-3.54-1.46l-3.6-3.6a1.6 1.6 0 0 1 2.26-2.26L8.5 13.3z"></path>
            </svg>
        </button>
        <p id="pose-status" role="status" aria-live="polite">Mouse controls active</p>
    </div>
    <div id="flash-indicator" role="status" aria-live="polite" aria-label="Flash reset is off">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 18h6m-5 3h4m-5-6.2A6 6 0 1 1 15 15c-.8.6-1 1.4-1 2H10c0-.7-.2-1.5-1-2.2Z"></path>
            <path d="M12 4v1m6.2 1.8-.7.7M20 12h-1M6.5 6.8l-.7-.7M5 12H4"></path>
        </svg>
        <span id="flash-status" class="visually-hidden">Enable webcam controls to use flash reset.</span>
    </div>
    <div id="camera-preview" hidden>
        <button id="camera-preview-toggle" type="button" aria-label="Show camera" aria-expanded="false" aria-controls="camera-feed">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7.5h3l1.5-2h7l1.5 2h3v11H4z"></path>
                <circle cx="12" cy="13" r="3.5"></circle>
            </svg>
        </button>
    </div>
    <button id="reset-button" type="button" aria-label="Reset game" title="Reset game">×</button>
    <script src="sketch.js"></script>
</body>
</html>
